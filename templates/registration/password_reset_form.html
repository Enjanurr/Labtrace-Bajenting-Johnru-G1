{% extends "base.html" %}
{% block title %}Reset password{% endblock %}

{% block content %}
<div class="mx-auto flex min-h-[60vh] max-w-md items-center py-4">
  <div class="w-full rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
    <p class="text-sm font-semibold uppercase tracking-wider text-indigo-600">Account recovery</p>
    <h1 class="mt-2 text-2xl font-bold tracking-tight text-slate-900">Forgot your password?</h1>
    <p class="mt-1 text-sm leading-6 text-slate-500">Enter your email and we will send you a reset link.</p>

    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      <div class="space-y-1">
        <label for="id_email" class="block text-sm font-medium text-slate-700">Email</label>
        <input type="email" name="email" id="id_email" required autofocus placeholder="you@school.edu"
               class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
        {% for error in form.email.errors %}<p class="text-xs text-red-600">{{ error }}</p>{% endfor %}
      </div>
      <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300">Send reset link</button>
    </form>

    <p class="mt-6 text-center text-sm"><a href="/accounts/login/" class="font-medium text-indigo-600 hover:underline">Back to login</a></p>
  </div>
</div>
{% endblock %}
