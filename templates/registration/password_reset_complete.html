{% extends "base.html" %}
{% block title %}Password changed{% endblock %}

{% block content %}
<div class="mx-auto flex min-h-[60vh] max-w-md items-center py-4">
  <div class="w-full rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-sm sm:p-8">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-emerald-50 text-2xl font-bold text-emerald-600" aria-hidden="true">&check;</div>
    <h1 class="mt-5 text-2xl font-bold tracking-tight text-slate-900">Password changed</h1>
    <p class="mt-2 text-sm leading-6 text-slate-500">You can now log in with your new password.</p>
    <a href="/accounts/login/" class="mt-6 inline-flex rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:text-purple-200 hover:drop-shadow-[0_0_8px_rgba(147,51,234,0.5)] active:border active:border-slate-200 active:bg-slate-100 active:text-slate-800">Go to login</a>
  </div>
</div>
{% endblock %}
