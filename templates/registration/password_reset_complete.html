{% extends "base.html" %}
{% block title %}Password changed{% endblock %}

{% block content %}
<div class="mx-auto flex min-h-[65vh] max-w-md flex-col justify-center py-6 sm:py-10">
  <div class="rounded-2xl border border-slate-200/90 bg-white p-6 text-center shadow-soft-xl sm:p-8">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-50 text-emerald-600 ring-8 ring-emerald-50/50">
      <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    
    <span class="mt-4 inline-flex items-center rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-semibold uppercase tracking-wider text-emerald-700 ring-1 ring-inset ring-emerald-600/20">
      Success
    </span>

    <h1 class="mt-3 text-2xl font-extrabold tracking-tight text-slate-900">Password Changed</h1>
    <p class="mt-2 text-xs leading-relaxed text-slate-500">
      Your password has been successfully updated. You can now authenticate with your new credentials.
    </p>

    <div class="mt-6">
      <a href="{% url 'authentication:login' %}" 
         class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-soft-sm shadow-indigo-600/20 transition-all duration-150 hover:bg-indigo-700 active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
        <span>Proceed to Sign In</span>
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </a>
    </div>
  </div>
</div>
{% endblock %}
