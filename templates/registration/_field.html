<div class="field min-w-0 space-y-1">
  <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-700">{{ field.label }}</label>
  <div class="relative mt-1">
    {{ field }}
    {% if toggle %}
    <button type="button" data-target="#{{ field.id_for_label }}"
            class="toggle-password absolute inset-y-0 right-0 rounded-r-lg px-3 text-xs font-medium text-slate-500 transition hover:text-purple-600 hover:drop-shadow-[0_0_8px_rgba(147,51,234,0.5)] active:border active:border-slate-200 active:bg-slate-100 active:text-slate-800">Show</button>
    {% endif %}
  </div>
  {% if field.help_text and not field.errors %}
  <p class="mt-1 text-xs text-slate-500">{{ field.help_text }}</p>
  {% endif %}
  {% for error in field.errors %}
  <p class="field-error mt-1 text-xs font-medium text-red-600">{{ error }}</p>
  {% endfor %}
</div>
