{% extends "base.html" %}
{% block title %}Access denied{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg rounded-2xl border border-red-100 bg-white p-6 text-center shadow-sm sm:p-10">
  <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-red-50 text-lg font-bold text-red-600">403</div>
  <h1 class="mt-5 text-2xl font-bold tracking-tight text-slate-900">Access denied</h1>
  <p class="mt-2 text-sm leading-6 text-slate-600">
    Your role (<strong>{{ user.get_role_display }}</strong>) can't open this page.
  </p>
  <a href="{% url 'dashboard:home' %}" class="mt-6 inline-flex rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300">Back to dashboard</a>
</div>
{% endblock %}
