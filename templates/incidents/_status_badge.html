{% if status == "REPORTED" %}<span class="rounded-full bg-amber-100 px-2.5 py-0.5 text-xs font-semibold text-amber-700">Reported</span>
{% elif status == "INVESTIGATION" %}<span class="rounded-full bg-blue-100 px-2.5 py-0.5 text-xs font-semibold text-blue-700">Under Investigation</span>
{% elif status == "RESOLVED" %}<span class="rounded-full bg-green-100 px-2.5 py-0.5 text-xs font-semibold text-green-700">Resolved</span>
{% else %}<span class="rounded-full bg-slate-200 px-2.5 py-0.5 text-xs font-semibold text-slate-700">Closed</span>{% endif %}
