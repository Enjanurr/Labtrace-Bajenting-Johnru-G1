{% if status == "REPORTED" %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-amber-50 px-2.5 py-0.5 text-xs font-medium text-amber-700 ring-1 ring-inset ring-amber-600/10">
  <span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>
  Reported
</span>
{% elif status == "INVESTIGATION" %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-blue-50 px-2.5 py-0.5 text-xs font-medium text-blue-700 ring-1 ring-inset ring-blue-600/10">
  <span class="h-1.5 w-1.5 rounded-full bg-blue-500"></span>
  Under Investigation
</span>
{% elif status == "RESOLVED" %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-medium text-emerald-700 ring-1 ring-inset ring-emerald-600/10">
  <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
  Resolved
</span>
{% else %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-2.5 py-0.5 text-xs font-medium text-slate-700 ring-1 ring-inset ring-slate-500/10">
  <span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span>
  Closed
</span>
{% endif %}
